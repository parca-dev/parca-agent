# Profile labels for a Kubernetes deployment exporting to a Parca server.
#
# These are parca-agent's own label vocabulary -- `namespace`, `pod`,
# `container` -- which is what the Parca UI and stored queries are written
# against. It mirrors the default in deploy/lib/parca-agent/parca-agent.libsonnet,
# which is what a jsonnet-based deployment renders into its ConfigMap; this
# copy is for deployments that pass --config-path directly.
#
# For OTLP export, see config/examples/otlp-semconv-k8s.yaml, which promotes
# the same metadata under OpenTelemetry semantic convention names. The two are
# alternatives, not layers: emitting both vocabularies doubles the resource
# labels on every profile.

relabel_configs:
- source_labels: [__meta_process_executable_compiler]
  target_label: compiler
- source_labels: [__meta_system_kernel_machine]
  target_label: arch
- source_labels: [__meta_system_kernel_release]
  target_label: kernel_version
- source_labels: [__meta_kubernetes_namespace]
  target_label: namespace
- source_labels: [__meta_kubernetes_pod_name]
  target_label: pod
- source_labels: [__meta_kubernetes_pod_container_name]
  target_label: container
- source_labels: [__meta_kubernetes_pod_container_image]
  target_label: container_image
- source_labels: [__meta_kubernetes_node_label_topology_kubernetes_io_region]
  target_label: region
- source_labels: [__meta_kubernetes_node_label_topology_kubernetes_io_zone]
  target_label: zone
- action: labelmap
  regex: __meta_kubernetes_pod_label_(.+)
  replacement: ${1}
- action: labeldrop
  regex: apps_kubernetes_io_pod_index|controller_revision_hash|statefulset_kubernetes_io_pod_name|pod_template_hash

